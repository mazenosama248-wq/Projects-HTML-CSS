<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card Component</title>
    <link href="images/favicon-32x32.png" rel="icon" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Kumbh+Sans:wght@400;700;900&family=Vibes&display=swap"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="main-card">
      <section class="main-section">
        <div class="img-card">
          <img src="images/bg-pattern-card.svg" alt="top picture" />
        </div>
        <div class="img-card-person">
          <img
            src="images/image-victor.jpg"
            alt="Person Picture"
            class="img-card-person"
          />
        </div>
        <div class="info-card">
          <h1 class="card-name">
            Victor Crest <span class="card-age">26</span>
          </h1>
          <p class="location">London</p>
        </div>
        <footer class="card-footer">
          <div class="footer-stat">
            <p>80K</p>
            <p><span class="p-card">Followers</span></p>
          </div>
          <div class="footer-stat">
            <p>803K</p>
            <p><span class="p-card">Likes</span></p>
          </div>
          <div class="footer-stat">
            <p>1.4K</p>
            <p><span class="p-card">Photos</span></p>
          </div>
        </footer>
      </section>
    </main>
  </body>
</html>
